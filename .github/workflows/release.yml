name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: arm64
          - platform: linux/arm/v7
            arch: armv7
          - platform: linux/arm/v6
            arch: armv6
          - platform: linux/386
            arch: "386"
          - platform: linux/riscv64
            arch: riscv64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches client version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version' client/arg.ggo | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match client/arg.ggo version $version" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux-${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=/tmp/artifacts/linux-${{ matrix.arch }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Prepare Linux artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          artifact_dir="/tmp/artifacts/linux-$ARCH"
          if [ ! -d "$artifact_dir" ]; then
            echo "Expected Linux artifact directory $artifact_dir" >&2
            ls -laR /tmp/artifacts 2>/dev/null || true
            exit 1
          fi
          cd "$artifact_dir"
          rm -f provenance.json
          ls -la
          for binary in rctlcli rctlser; do
            if [ ! -f "$binary" ]; then
              echo "Expected $binary in Linux artifact output" >&2
              exit 1
            fi
            file "$binary" | grep -qi "statically linked"
            staging="$(mktemp -d)"
            cp "$binary" "$staging/$binary"
            chmod +x "$staging/$binary"
            cat > "$staging/README.txt" << 'READMEOF'
          rctl Linux static build

          Extract this archive preserving executable permissions.
          The client requires a trusted CA certificate (RCTL_CA_FILE).
          The server requires a certificate and matching private key
          (RCTL_CERT_FILE and RCTL_PRIV_FILE).
          The server certificate must match the client's configured hostname/IP.
          The interactive server also requires terminal data (e.g. ncurses terminfo).
          READMEOF
            tar --owner=0 --group=0 --numeric-owner -czf "$binary-linux-$ARCH.tar.gz" -C "$staging" "$binary" README.txt
            rm -rf "$staging" "$binary"
          done
          ls -la
          if [ ! -f "rctlcli-linux-$ARCH.tar.gz" ] || [ ! -f "rctlser-linux-$ARCH.tar.gz" ]; then
            echo "Expected client and server archives in Linux artifact output" >&2
            exit 1
          fi
          artifact_count="$(find . -maxdepth 1 -type f -printf '.' | wc -c)"
          if [ "$artifact_count" -ne 2 ]; then
            echo "Expected exactly two Linux release artifacts, found $artifact_count:" >&2
            find . -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          fi

      - name: List artifacts
        run: ls -laR /tmp/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rctl-linux-${{ matrix.arch }}
          path: /tmp/artifacts/linux-${{ matrix.arch }}/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts
          pattern: rctl-*
          merge-multiple: true

      - name: List release files
        run: ls -la /tmp/release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
