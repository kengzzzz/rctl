name: static-binaries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and export static binaries
        uses: docker/build-push-action@v6
        with:
          context: .
          target: export
          outputs: type=local,dest=./dist

      - name: Inspect binaries
        run: |
          ls -lh ./dist/
          for binary in rctlcli rctlser; do
            file "./dist/$binary"
            file "./dist/$binary" | grep -qi "statically linked"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rctl-static
          path: |
            ./dist/rctlcli
            ./dist/rctlser
          if-no-files-found: error
